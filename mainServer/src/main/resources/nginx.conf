server {
    listen 80;
    server_name _;

    # 访问 /yixiu-site 自动补 /
    location = /yixiu-site {
        return 301 /yixiu-site/;
    }

    # Vue3 前端（base = /yixiu-site/）
    location ^~ /yixiu-site/ {
            alias /usr/share/nginx/html/;
            index index.html;
            try_files $uri $uri/ /yixiu-site/index.html;
        }

    # 后端接口
    location /api/ {
            proxy_pass http://8.148.253.180:8080/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
}