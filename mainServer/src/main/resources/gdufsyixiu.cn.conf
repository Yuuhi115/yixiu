server {
    listen 80;
    server_name www.gdufsyixiu.cn gdufsyixiu.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.gdufsyixiu.cn gdufsyixiu.cn;

    ssl_certificate     /etc/nginx/ssl/gdufsyixiu.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/gdufsyixiu.cn.key;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://yixiu-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
